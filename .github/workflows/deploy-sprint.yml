name: Deploy

on:
  push:
    branches: [ "sprint/*" ]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: SPRINT
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          cat >>~/.ssh/config <<END
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
      - name: Deploy
        env:
          SPRINT_BRANCH: ${{ github.ref_name }}
        run: |
          branch=$(python3 -c 'import os, shlex; print(shlex.quote(os.environ["SPRINT_BRANCH"]))')
          ssh server "exec \"\$HOME/deploy.sh\" $branch"
      - name: Update schema
        run: ssh server  'source $HOME/initenv.sh && cd "$DOCUMENT_ROOT" && wp-cli update-db-schema'
